name: Update Bus Routes

on:
  workflow_dispatch: # Keep manual trigger option
  schedule:
    - cron: "*/5 * * * *" # Run every 5 minutes

jobs:
  update-buses:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if script exists
        run: |
          echo "Checking for scripts/bus.py..."
          ls -la scripts/ || echo "scripts/ directory not found"
          if [ -f "scripts/bus.py" ]; then
            echo "✓ scripts/bus.py found"
          else
            echo "✗ scripts/bus.py NOT found"
            echo "Current directory contents:"
            ls -la
          fi

      - name: Check secrets
        run: |
          if [ -n "${{ secrets.GSHEETS_CREDS }}" ]; then
            echo "✓ GSHEETS_CREDS secret is set"
          else
            echo "✗ GSHEETS_CREDS secret is NOT set"
          fi

          if [ -n "${{ secrets.FIREBASE_CREDS }}" ]; then
            echo "✓ FIREBASE_CREDS secret is set"
          else
            echo "✗ FIREBASE_CREDS secret is NOT set"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install gspread google-auth firebase-admin

      - name: Create credentials files
        run: |
          echo '${{ secrets.GSHEETS_CREDS }}' > gsheets.json
          echo '${{ secrets.FIREBASE_CREDS }}' > firebase.json
          echo "Credentials files created"
          ls -la *.json

      - name: Run bus routes update script
        run: |
          python scripts/bus.py

      - name: Clean up credentials
        if: always()
        run: |
          rm -f gsheets.json firebase.json
