    - assets/profile/academy/
    - assets/app_icons/png/
    - assets/profile/grover/
    - assets/profile/aspen/
    - assets/profile/rowan/
    - assets/profile/sakura/
    - assets/profile/abies/
    - assets/profile/cedite/
    - assets/story/characters/
    - assets/story/characters/ep0/
    - assets/story/characters/ep1/
    - assets/story/characters/ep2/
    - assets/story/characters/ep2/sheep/
    - assets/story/characters/ep2/baby/
    - assets/story/characters/ep3/
    - assets/story/inventory/
    - shorebird.yaml
    - .env
